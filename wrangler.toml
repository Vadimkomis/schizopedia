# Cloudflare Workers static-assets deployment.
# Serves the Vite build output (dist/) as a static site. No Worker script —
# this is an assets-only deployment. SPA routing is handled by
# not_found_handling so deep links (e.g. /guide/...) resolve to index.html.
name = "schizopedia"
compatibility_date = "2025-06-01"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
