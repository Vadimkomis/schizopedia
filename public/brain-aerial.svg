      <path d="M254 171C238 214 251 254 221 290"/>
      <path d="M319 149C291 192 312 224 285 264"/>
      <path d="M352 210C315 247 334 279 299 319"/>
      <path d="M257 283C228 313 243 350 215 378"/>
      <path d="M324 344C291 373 305 407 282 436"/>
      <path d="M199 253C226 270 233 293 221 316"/>
      <path d="M279 216C257 241 261 272 247 289"/>
      <path d="M198 365C231 359 251 371 259 397"/>
      <path d="M301 287C275 309 277 334 264 350"/>
    </g>
  </defs>

  <style>
    .brain-float {
      animation: brain-float 7s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }
    .signal-line {
      animation: signal-flow 4.2s linear infinite;
    }
    .signal-line.delay { animation-delay: -1.7s; }
    .signal-line.slow { animation-duration: 5.6s; animation-delay: -2.5s; }
    .pulse { opacity: .72; animation: pulse 2.7s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .pulse.delay { animation-delay: -1.2s; }
    .pulse.late { animation-delay: -2s; }
    .ripple { opacity: 0; animation: ripple 3s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    .ripple.delay { animation-delay: -1.55s; }
    .rotor { animation: rotate 11s linear infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes brain-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    @keyframes signal-flow { to { stroke-dashoffset: -66; } }
    @keyframes pulse {
      0%, 100% { opacity: .54; transform: scale(.84); }
      50% { opacity: 1; transform: scale(1.18); }
    }
    @keyframes ripple {
      0% { opacity: .62; transform: scale(.35); }
      72%, 100% { opacity: 0; transform: scale(1.5); }
    }
    @keyframes rotate { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .brain-float, .signal-line, .pulse, .ripple, .rotor { animation: none !important; }
    }
  </style>

