<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" role="img" aria-labelledby="title description">
  <title id="title">An aerial brain knowledge landscape</title>
  <desc id="description">A pale isometric brain with layered folds, research pathways, and softly moving signals.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.86" y2="1">
      <stop offset="0" stop-color="#f8fafb"/>
      <stop offset="0.48" stop-color="#eef2f5"/>
      <stop offset="1" stop-color="#e2e8ed"/>
    </linearGradient>
    <linearGradient id="platform" x1="0.15" y1="0" x2="0.86" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#dce3e8" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="left-top" x1="0.1" y1="0.05" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.58" stop-color="#f4f7f8"/>
      <stop offset="1" stop-color="#dce3e7"/>
    </linearGradient>
    <linearGradient id="right-top" x1="0.92" y1="0.06" x2="0.08" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.62" stop-color="#f2f5f7"/>
      <stop offset="1" stop-color="#d9e0e5"/>
    </linearGradient>
    <radialGradient id="rose-glow">
      <stop offset="0" stop-color="#ff7e8f" stop-opacity="0.92"/>
      <stop offset="0.28" stop-color="#ff91a2" stop-opacity="0.56"/>
      <stop offset="1" stop-color="#ff91a2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet-glow">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.9"/>
      <stop offset="0.3" stop-color="#8b72ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#8b72ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyan-glow">
      <stop offset="0" stop-color="#48bfd0" stop-opacity="0.88"/>
      <stop offset="0.3" stop-color="#67cfdd" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#67cfdd" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse" patternTransform="skewY(-28) scale(1 .62)">
      <path d="M34 0H0V34" fill="none" stroke="#b8c3cb" stroke-opacity="0.24" stroke-width="1"/>
    </pattern>

    <filter id="brain-shadow" x="-35%" y="-35%" width="170%" height="190%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="small-shadow" x="-60%" y="-60%" width="220%" height="240%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#80909d" flood-opacity="0.25"/>
    </filter>
    <filter id="light-glow" x="-160%" y="-160%" width="420%" height="420%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <path id="brain-outline" d="M397 139C352 116 294 119 244 142C178 172 141 223 138 287C135 351 165 410 217 440C267 469 326 448 371 414C386 403 395 388 400 369C405 388 414 403 429 414C474 448 533 469 583 440C635 410 665 351 662 287C659 223 622 172 556 142C506 119 448 116 403 139C401 140 399 140 397 139Z"/>
